<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garfield's Big Day</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta property="og:title" content="Garfield's Big Day">
    <meta property="og:description" content="Help Garfield catch lasagna and avoid Mondays in this fun browser game!">
    <meta property="og:image" content="favicon.svg">
    <meta property="og:type" content="website">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka One', cursive;
            background-color: #fbd38d; /* Warm orange background */
            background-image: radial-gradient(#ed8936 1px, transparent 1px);
            background-size: 20px 20px;
            touch-action: none; /* Prevent scrolling while playing on mobile */
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100dvh;
            max-height: 600px;
            margin: 0 auto;
            background-color: #fffaf0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            border-left: 4px solid #ed8936;
            border-right: 4px solid #ed8936;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 250, 240, 0.9);
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        /* Speed boost aura effect */
        .speed-boost {
            box-shadow: 0 0 20px 10px rgba(56, 178, 172, 0.5) inset;
            transition: box-shadow 0.2s ease;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen m-0">

    <div id="game-container">
        <!-- Game HUD -->
        <div class="absolute top-0 left-0 w-full flex justify-between px-4 py-2 z-0 pointer-events-none">
            <div class="text-orange-600 text-xl text-shadow">Score: <span id="score">0</span></div>
            <div class="text-red-600 text-xl text-shadow">Lives: <span id="lives">3</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1 class="text-4xl text-orange-600 text-center mb-2 drop-shadow-md">Garfield's<br>Big Day</h1>
            <p class="text-gray-700 text-center mb-6 px-4 text-sm leading-relaxed">
                🍝 Lasagna = 10 pts <br>
                🍕 Pizza = 5 pts <br>
                ☕ Coffee = Speed Boost <br>
                ⏰ Avoid Clocks! <br><br>
                <span>Use Left/Right Arrow Keys or Drag to Move</span>
            </p>
            <button id="start-btn" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105">
                START GAME
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <h1 class="text-4xl text-red-600 text-center mb-2 drop-shadow-md">GAME OVER</h1>
            <p class="text-gray-700 text-xl mb-6">Final Score: <span id="final-score" class="text-orange-600 font-bold">0</span></p>
            <p id="game-over-msg" class="text-center text-sm mb-6 px-4 text-gray-600">I hate Mondays...</p>
            <button id="restart-btn" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105">
                PLAY AGAIN
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('game-container');
        
        // UI Elements
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Game State
        let gameState = 'START'; 
        let animationId;
        let score = 0;
        let lives = 3;
        let frameCount = 0;
        let difficultyMultiplier = 1;

        // Entities
        const player = {
            x: 160,
            y: 520,
            width: 80,
            height: 70,
            baseSpeed: 6,
            speed: 6,
            speedBoostTimer: 0
        };

        let items = [];

        // Input Tracking
        const keys = {
            ArrowLeft: false,
            ArrowRight: false
        };

        // Event Listeners
        window.addEventListener('keydown', (e) => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (gameState === 'PLAYING') {
                const rect = canvas.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                player.x = touchX - player.width / 2;
            }
        }, { passive: false });
        canvas.addEventListener('mousemove', (e) => {
            if(gameState === 'PLAYING' && e.buttons === 1) {
                const rect = canvas.getBoundingClientRect();
                player.x = e.clientX - rect.left - player.width / 2;
            }
        });

        // Speech Function
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                // Try to sound like Garfield (lazy, lower pitch)
                utterance.pitch = 0.4;
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Initialize Audio on first click to bypass browser auto-play policies
        function initializeAudioAndStart() {
            if ('speechSynthesis' in window) {
                let silentUtterance = new SpeechSynthesisUtterance('');
                silentUtterance.volume = 0;
                window.speechSynthesis.speak(silentUtterance);
            }
            initGame();
        }

        // Handle start and restart with both click and touchstart for mobile responsiveness
        function handleStartEvent(e) {
            e.preventDefault(); // Prevent double-firing on devices that support both
            initializeAudioAndStart();
        }
        
        function handleRestartEvent(e) {
            e.preventDefault();
            initGame();
        }

        startBtn.addEventListener('click', handleStartEvent);
        startBtn.addEventListener('touchstart', handleStartEvent, {passive: false});
        
        restartBtn.addEventListener('click', handleRestartEvent);
        restartBtn.addEventListener('touchstart', handleRestartEvent, {passive: false});

        function spawnItem() {
            const rand = Math.random();
            const size = 40;
            const baseSpeed = (Math.random() * 2 + 2) * difficultyMultiplier;

            if (rand < 0.20) {
                // 20% Lasagna (10 pts)
                items.push({ x: Math.random() * (canvas.width - size), y: -50, width: size, height: size, dx: 0, dy: baseSpeed, type: 'food', emoji: '🍝', points: 10 });
            } else if (rand < 0.45) {
                // 25% Pizza (5 pts)
                items.push({ x: Math.random() * (canvas.width - size), y: -50, width: size, height: size, dx: 0, dy: baseSpeed, type: 'food', emoji: '🍕', points: 5 });
            } else if (rand < 0.55) {
                // 10% Coffee (Speed Boost)
                items.push({ x: Math.random() * (canvas.width - size), y: -50, width: size, height: size, dx: 0, dy: baseSpeed, type: 'coffee', emoji: '☕', points: 0 });
            } else {
                // 45% Alarm Clock (Vertical Obstacle)
                items.push({ x: Math.random() * (canvas.width - size), y: -50, width: size, height: size, dx: 0, dy: baseSpeed * 1.3, type: 'obstacle_clock', emoji: '⏰', points: 0 });
            }
        }

        function initGame() {
            gameState = 'PLAYING';
            score = 0;
            lives = 3;
            frameCount = 0;
            difficultyMultiplier = 1;
            items = [];
            player.x = canvas.width / 2 - player.width / 2;
            player.speedBoostTimer = 0;
            keys.ArrowLeft = false;
            keys.ArrowRight = false;
            gameContainer.classList.remove('speed-boost');

            scoreEl.innerText = score;
            livesEl.innerText = lives;

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            if (animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Handle Speed Boost
            if (player.speedBoostTimer > 0) {
                player.speed = player.baseSpeed * 1.8;
                player.speedBoostTimer--;
                if (player.speedBoostTimer === 0) {
                    gameContainer.classList.remove('speed-boost');
                }
            } else {
                player.speed = player.baseSpeed;
            }

            // Player Movement
            if (keys.ArrowLeft) player.x -= player.speed;
            if (keys.ArrowRight) player.x += player.speed;

            // Canvas boundaries
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Difficulty progression
            difficultyMultiplier = 1 + (score / 200);

            // Spawning
            frameCount++;
            const spawnRate = Math.max(25, 70 - Math.floor(score / 15)); 
            if (frameCount % spawnRate === 0) {
                spawnItem();
            }

            // Update Items
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.x += item.dx;
                item.y += item.dy;

                // Collision Box Setup (slightly smaller than sprite for forgiveness)
                const margin = 10;
                
                // Collision Detection
                if (
                    player.x < item.x + item.width - margin &&
                    player.x + player.width - margin > item.x &&
                    player.y < item.y + item.height - margin &&
                    player.y + player.height - margin > item.y
                ) {
                    // Collision Logic
                    if (item.type === 'food') {
                        score += item.points;
                        scoreEl.innerText = score;
                        speak("yum");
                    } else if (item.type === 'coffee') {
                        player.speedBoostTimer = 300; // ~5 seconds of boost
                        gameContainer.classList.add('speed-boost');
                    } else if (item.type.startsWith('obstacle')) {
                        lives--;
                        livesEl.innerText = lives;
                        if (item.type === 'obstacle_clock') {
                            speak("Awww Mondays");
                        }
                        
                        if (lives <= 0) {
                            endGame();
                        }
                    }
                    items.splice(i, 1);
                    continue;
                }

                // Cleanup Off-Screen Items
                if (item.y > canvas.height + 100 || item.x < -100 || item.x > canvas.width + 100) {
                    items.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (gameState !== 'PLAYING') return;

            // Draw Garfield
            drawGarfield(ctx, player.x, player.y, player.width, player.height, player.speedBoostTimer > 0);

            // Draw Items
            for (const item of items) {
                ctx.font = `${item.width}px Arial`;
                ctx.textBaseline = 'top';
                ctx.fillText(item.emoji, item.x, item.y);
            }
        }

        function drawGarfield(ctx, x, y, w, h, isBoosted) {
            ctx.save();
            ctx.translate(x, y);

            const orange = '#FF8C00';
            const pink = '#FF69B4';

            // Draw a subtle aura if boosted
            if (isBoosted) {
                ctx.fillStyle = 'rgba(56, 178, 172, 0.3)';
                ctx.beginPath();
                ctx.ellipse(w/2, h/2, w*0.7, h*0.7, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Body
            ctx.fillStyle = orange;
            ctx.beginPath();
            ctx.ellipse(w/2, h*0.65, w*0.45, h*0.35, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'black';
            ctx.stroke();

            // Body Stripes
            ctx.beginPath();
            ctx.moveTo(w*0.15, h*0.55); ctx.lineTo(w*0.25, h*0.6);
            ctx.moveTo(w*0.1, h*0.7); ctx.lineTo(w*0.2, h*0.75);
            ctx.moveTo(w*0.85, h*0.55); ctx.lineTo(w*0.75, h*0.6);
            ctx.moveTo(w*0.9, h*0.7); ctx.lineTo(w*0.8, h*0.75);
            ctx.lineWidth = 3;
            ctx.stroke();

            // Head
            ctx.fillStyle = orange;
            ctx.beginPath();
            ctx.ellipse(w/2, h*0.35, w*0.4, h*0.3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.stroke();

            // Ears
            ctx.beginPath();
            ctx.moveTo(w*0.15, h*0.2); 
            ctx.lineTo(w*0.05, -h*0.05);
            ctx.lineTo(w*0.35, h*0.15);
            ctx.moveTo(w*0.85, h*0.2); 
            ctx.lineTo(w*0.95, -h*0.05);
            ctx.lineTo(w*0.65, h*0.15);
            ctx.fillStyle = orange;
            ctx.fill();
            ctx.stroke();

            // Head Stripes
            ctx.beginPath();
            ctx.moveTo(w*0.5, h*0.05); ctx.lineTo(w*0.5, h*0.15);
            ctx.moveTo(w*0.35, h*0.08); ctx.lineTo(w*0.42, h*0.16);
            ctx.moveTo(w*0.65, h*0.08); ctx.lineTo(w*0.58, h*0.16);
            ctx.lineWidth = 2;
            ctx.stroke();

            // Eyes 
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.ellipse(w*0.35, h*0.35, w*0.15, h*0.2, 0, 0, Math.PI * 2);
            ctx.ellipse(w*0.65, h*0.35, w*0.15, h*0.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Lazy Eyelids (Wide awake if boosted!)
            ctx.fillStyle = orange;
            ctx.beginPath();
            if (isBoosted) {
                ctx.ellipse(w*0.35, h*0.2, w*0.15, h*0.05, 0, 0, Math.PI, true);
                ctx.ellipse(w*0.65, h*0.2, w*0.15, h*0.05, 0, 0, Math.PI, true);
            } else {
                ctx.ellipse(w*0.35, h*0.25, w*0.15, h*0.1, 0, 0, Math.PI, true);
                ctx.ellipse(w*0.65, h*0.25, w*0.15, h*0.1, 0, 0, Math.PI, true);
            }
            ctx.fill();
            
            // Eyelid bottom line
            ctx.beginPath();
            if(isBoosted) {
                ctx.moveTo(w*0.2, h*0.2); ctx.lineTo(w*0.5, h*0.2);
                ctx.moveTo(w*0.5, h*0.2); ctx.lineTo(w*0.8, h*0.2);
            } else {
                ctx.moveTo(w*0.2, h*0.35); ctx.lineTo(w*0.5, h*0.35);
                ctx.moveTo(w*0.5, h*0.35); ctx.lineTo(w*0.8, h*0.35);
            }
            ctx.stroke();

            // Pupils 
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(w*0.4, h*0.4, w*0.03, 0, Math.PI*2);
            ctx.arc(w*0.6, h*0.4, w*0.03, 0, Math.PI*2);
            ctx.fill();

            // Nose
            ctx.fillStyle = pink;
            ctx.beginPath();
            ctx.ellipse(w*0.5, h*0.48, w*0.08, h*0.05, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();

            // Smile
            ctx.beginPath();
            ctx.moveTo(w*0.25, h*0.55);
            ctx.quadraticCurveTo(w*0.5, h*0.65, w*0.75, h*0.52);
            ctx.lineTo(w*0.78, h*0.49);
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        function endGame() {
            gameState = 'GAMEOVER';
            finalScoreEl.innerText = score;
            
            const msgEl = document.getElementById('game-over-msg');
            if(score < 50) msgEl.innerText = "I hate Mondays...";
            else if(score < 150) msgEl.innerText = "Not enough lasagna!";
            else msgEl.innerText = "Purr-fect! You're a lasagna master.";

            gameOverScreen.classList.remove('hidden');
        }

        function gameLoop() {
            update();
            draw();
            if (gameState === 'PLAYING') {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        // Draw initial static scene
        ctx.fillStyle = '#fbd38d';
        ctx.fillRect(0,0,canvas.width, canvas.height);
        drawGarfield(ctx, canvas.width/2 - 40, 520, 80, 70, false);
    </script>
</body>
</html>
