<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garfield's Big Day</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka One', cursive;
            background-color: #fbd38d; /* Warm orange background */
            background-image: radial-gradient(#ed8936 1px, transparent 1px);
            background-size: 20px 20px;
            touch-action: none; /* Prevent scrolling while playing on mobile */
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100dvh;
            max-height: 600px;
            margin: 0 auto;
            background-color: #fffaf0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            border-left: 4px solid #ed8936;
            border-right: 4px solid #ed8936;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 250, 240, 0.9);
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen m-0">

    <div id="game-container">
        <!-- Game HUD -->
        <div class="absolute top-0 left-0 w-full flex justify-between px-4 py-2 z-0 pointer-events-none">
            <div class="text-orange-600 text-xl text-shadow">Score: <span id="score">0</span></div>
            <div class="text-red-600 text-xl text-shadow">Lives: <span id="lives">3</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1 class="text-4xl text-orange-600 text-center mb-2 drop-shadow-md">Garfield's<br>Big Day</h1>
            <p class="text-gray-700 text-center mb-6 px-4 text-sm">
                Catch the Lasagna 🍝!<br>Avoid the Alarm Clocks ⏰ (Mondays)!<br><br>
                <span>Use Left/Right Arrow Keys or Drag to Move</span>
            </p>
            <button id="start-btn" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105">
                START GAME
            </button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <h1 class="text-4xl text-red-600 text-center mb-2 drop-shadow-md">GAME OVER</h1>
            <p class="text-gray-700 text-xl mb-6">Final Score: <span id="final-score" class="text-orange-600 font-bold">0</span></p>
            <p id="game-over-msg" class="text-center text-sm mb-6 px-4 text-gray-600">I hate Mondays...</p>
            <button id="restart-btn" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105">
                PLAY AGAIN
            </button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Game State
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let animationId;
        let score = 0;
        let lives = 3;
        let frameCount = 0;
        let difficultyMultiplier = 1;

        // Entities
        const player = {
            x: 160,
            y: 520,
            width: 80,
            height: 70,
            speed: 6,
            dx: 0
        };

        let items = []; // Array to hold falling objects

        // Input Tracking
        const keys = {
            ArrowLeft: false,
            ArrowRight: false
        };

        // Event Listeners (Keyboard)
        window.addEventListener('keydown', (e) => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            if(keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        // Touch & Mouse Dragging on Canvas
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (gameState === 'PLAYING') {
                const rect = canvas.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                player.x = touchX - player.width / 2;
            }
        }, { passive: false });

        canvas.addEventListener('mousemove', (e) => {
            if(gameState === 'PLAYING' && e.buttons === 1) { // Left click drag
                const rect = canvas.getBoundingClientRect();
                player.x = e.clientX - rect.left - player.width / 2;
            }
        });

        // Start/Restart Buttons
        startBtn.addEventListener('click', initGame);
        restartBtn.addEventListener('click', initGame);

        function spawnItem() {
            // Determine type: 70% Lasagna, 30% Alarm Clock
            const isGood = Math.random() > 0.3;
            
            const size = 40;
            const x = Math.random() * (canvas.width - size);
            // Speed increases slightly with score
            const speed = (Math.random() * 2 + 2) * difficultyMultiplier;

            items.push({
                x: x,
                y: -50,
                width: size,
                height: size,
                speed: speed,
                type: isGood ? 'lasagna' : 'clock',
                emoji: isGood ? '🍝' : '⏰',
                points: isGood ? 10 : 0
            });
        }

        function initGame() {
            gameState = 'PLAYING';
            score = 0;
            lives = 3;
            frameCount = 0;
            difficultyMultiplier = 1;
            items = [];
            player.x = canvas.width / 2 - player.width / 2;
            keys.ArrowLeft = false;
            keys.ArrowRight = false;

            scoreEl.innerText = score;
            livesEl.innerText = lives;

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            if (animationId) cancelAnimationFrame(animationId);
            gameLoop();
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Player Movement
            if (keys.ArrowLeft) player.x -= player.speed;
            if (keys.ArrowRight) player.x += player.speed;

            // Canvas boundaries
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Increase difficulty over time
            difficultyMultiplier = 1 + (score / 200);

            // Spawn items
            frameCount++;
            // Spawn rate gets slightly faster as score increases
            const spawnRate = Math.max(30, 80 - Math.floor(score / 10)); 
            if (frameCount % spawnRate === 0) {
                spawnItem();
            }

            // Update Items
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += item.speed;

                // Collision Detection
                if (
                    player.x < item.x + item.width - 10 &&
                    player.x + player.width - 10 > item.x &&
                    player.y < item.y + item.height - 10 &&
                    player.y + player.height - 10 > item.y
                ) {
                    // Collision occurred
                    if (item.type === 'lasagna') {
                        score += item.points;
                        scoreEl.innerText = score;
                        // Brief visual feedback could go here
                    } else if (item.type === 'clock') {
                        lives--;
                        livesEl.innerText = lives;
                        if (lives <= 0) {
                            endGame();
                        }
                    }
                    items.splice(i, 1); // Remove item
                    continue;
                }

                // Remove items that fall off screen
                if (item.y > canvas.height) {
                    // If missed a good item, maybe penalize? Nah, just remove it.
                    items.splice(i, 1);
                }
            }
        }

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState !== 'PLAYING') return;

            // Draw Custom Garfield
            drawGarfield(ctx, player.x, player.y, player.width, player.height);

            // Draw Items
            for (const item of items) {
                ctx.font = '40px Arial';
                ctx.textBaseline = 'top';
                ctx.fillText(item.emoji, item.x, item.y);
            }
        }

        function drawGarfield(ctx, x, y, w, h) {
            ctx.save();
            ctx.translate(x, y);

            const orange = '#FF8C00';
            const pink = '#FF69B4';

            // Body
            ctx.fillStyle = orange;
            ctx.beginPath();
            ctx.ellipse(w/2, h*0.65, w*0.45, h*0.35, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'black';
            ctx.stroke();

            // Body Stripes
            ctx.beginPath();
            ctx.moveTo(w*0.15, h*0.55); ctx.lineTo(w*0.25, h*0.6);
            ctx.moveTo(w*0.1, h*0.7); ctx.lineTo(w*0.2, h*0.75);
            ctx.moveTo(w*0.85, h*0.55); ctx.lineTo(w*0.75, h*0.6);
            ctx.moveTo(w*0.9, h*0.7); ctx.lineTo(w*0.8, h*0.75);
            ctx.lineWidth = 3;
            ctx.stroke();

            // Head
            ctx.fillStyle = orange;
            ctx.beginPath();
            ctx.ellipse(w/2, h*0.35, w*0.4, h*0.3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.stroke();

            // Ears
            ctx.beginPath();
            ctx.moveTo(w*0.15, h*0.2); // left ear
            ctx.lineTo(w*0.05, -h*0.05);
            ctx.lineTo(w*0.35, h*0.15);
            ctx.moveTo(w*0.85, h*0.2); // right ear
            ctx.lineTo(w*0.95, -h*0.05);
            ctx.lineTo(w*0.65, h*0.15);
            ctx.fillStyle = orange;
            ctx.fill();
            ctx.stroke();

            // Head Stripes
            ctx.beginPath();
            ctx.moveTo(w*0.5, h*0.05); ctx.lineTo(w*0.5, h*0.15);
            ctx.moveTo(w*0.35, h*0.08); ctx.lineTo(w*0.42, h*0.16);
            ctx.moveTo(w*0.65, h*0.08); ctx.lineTo(w*0.58, h*0.16);
            ctx.lineWidth = 2;
            ctx.stroke();

            // Eyes (large white ovals)
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.ellipse(w*0.35, h*0.35, w*0.15, h*0.2, 0, 0, Math.PI * 2);
            ctx.ellipse(w*0.65, h*0.35, w*0.15, h*0.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Lazy Eyelids (half closed)
            ctx.fillStyle = orange;
            ctx.beginPath();
            ctx.ellipse(w*0.35, h*0.25, w*0.15, h*0.1, 0, 0, Math.PI, true);
            ctx.ellipse(w*0.65, h*0.25, w*0.15, h*0.1, 0, 0, Math.PI, true);
            ctx.fill();
            
            // Eyelid bottom line
            ctx.beginPath();
            ctx.moveTo(w*0.2, h*0.35); ctx.lineTo(w*0.5, h*0.35);
            ctx.moveTo(w*0.5, h*0.35); ctx.lineTo(w*0.8, h*0.35);
            ctx.stroke();

            // Pupils (looking forward/lazy)
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(w*0.4, h*0.4, w*0.03, 0, Math.PI*2);
            ctx.arc(w*0.6, h*0.4, w*0.03, 0, Math.PI*2);
            ctx.fill();

            // Nose
            ctx.fillStyle = pink;
            ctx.beginPath();
            ctx.ellipse(w*0.5, h*0.48, w*0.08, h*0.05, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.stroke();

            // Cynical Smile
            ctx.beginPath();
            ctx.moveTo(w*0.25, h*0.55);
            ctx.quadraticCurveTo(w*0.5, h*0.65, w*0.75, h*0.52);
            // Smirk notch
            ctx.lineTo(w*0.78, h*0.49);
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        function endGame() {
            gameState = 'GAMEOVER';
            finalScoreEl.innerText = score;
            
            const msgEl = document.getElementById('game-over-msg');
            if(score < 50) msgEl.innerText = "I hate Mondays...";
            else if(score < 150) msgEl.innerText = "Not enough lasagna!";
            else msgEl.innerText = "Purr-fect! You're a lasagna master.";

            gameOverScreen.classList.remove('hidden');
        }

        function gameLoop() {
            update();
            draw();
            if (gameState === 'PLAYING') {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        // Draw initial static scene
        ctx.fillStyle = '#fbd38d';
        ctx.fillRect(0,0,canvas.width, canvas.height);
        drawGarfield(ctx, canvas.width/2 - 40, 520, 80, 70);
    </script>
</body>
</html>
